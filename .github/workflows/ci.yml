name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Install Playwright browser (chromium)
        run: python -m playwright install --with-deps chromium

      # Excludes `live_llm` tests (need ANTHROPIC_API_KEY and hit a real
      # provider, so they are not part of the required, deterministic CI
      # gate -- see .CLAUDE/09_CLAUDE_START_PROMPT.md and the testing
      # strategy agreed with the user).
      - name: Run tests
        run: python -m pytest -q -m "not live_llm"
