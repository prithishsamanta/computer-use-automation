[project]
name = "cuas"
version = "0.1.0"
description = "Computer-Use Automation System - interface.ai take-home"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: exercises a real PlaywrightSurfaceAdapter against the demo app, no LLM",
    "live_llm: calls a real LLM provider and needs ANTHROPIC_API_KEY; excluded from default CI run",
]
